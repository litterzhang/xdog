[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog-tui"
version = "2.2.0"
description = "Terminal UI library with differential rendering"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [{ name = "HugeMan" }]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "wcwidth>=0.2.0",
]

[project.urls]
Homepage = "https://xdog.942295.xyz"
Repository = "https://github.com/litterzhang/xdog"
Documentation = "https://xdog.942295.xyz"
Issues = "https://github.com/litterzhang/xdog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
