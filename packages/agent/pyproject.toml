[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog-agent"
version = "2.4.6"
description = "Agent runtime with tool calling and state management"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [{ name = "HugeMan" }]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "xdog-ai>=2.4.6",
    "fastjsonschema",
    # Skill frontmatter is YAML; see xdog.agent.skills.manager for why it is
    # parsed rather than approximated.
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
acp = ["agent-client-protocol>=0.12.1,<0.13; python_version < '3.15'"]

[project.urls]
Homepage = "https://xdog.942295.xyz"
Repository = "https://github.com/litterzhang/xdog"
Documentation = "https://xdog.942295.xyz"
Issues = "https://github.com/litterzhang/xdog/issues"

[project.scripts]
xdog-agent = "xdog.agent.cli:main"

[[tool.mypy.overrides]]
module = ["fastjsonschema"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/xdog"]

[tool.pytest.ini_options]
# Repository-level test helpers; no runtime source-path injection.
pythonpath = ["../.."]
testpaths = ["tests"]
asyncio_mode = "auto"
