[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog-claw"
version = "2.3.0"
description = "AI agent orchestration runtime with long-term memory"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [{ name = "HugeMan" }]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "xdog-ai[openai]>=2.3.0",
    "xdog-agent>=2.3.0",
    "xdog-tui>=2.3.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27",
    "qrcode>=7.4",
    "croniter>=2.0",
]

[project.optional-dependencies]
search = ["sentence-transformers>=3.0.0", "sqlite-vec>=0.1.1", "rank-bm25>=0.2.2"]
all = ["sentence-transformers>=3.0.0", "sqlite-vec>=0.1.1", "rank-bm25>=0.2.2", "croniter>=2.0.0"]

[project.urls]
Homepage = "https://xdog.942295.xyz"
Repository = "https://github.com/litterzhang/xdog"
Documentation = "https://xdog.942295.xyz"
Issues = "https://github.com/litterzhang/xdog/issues"

[project.scripts]
xdog-claw = "xdog.claw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
