[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog-eyes"
version = "2.4.2"
description = "Declarative local observation and source-neutral agent event delivery"
classifiers = ["Operating System :: POSIX :: Linux"]
requires-python = ">=3.12"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["agent-client-protocol>=0.12.1,<0.13; python_version < '3.15'"]

[project.scripts]
xdog-eyes = "xdog.eyes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xdog"]

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
# Repository-level test helpers; no runtime source-path injection.
pythonpath = ["../.."]
testpaths = ["tests"]
asyncio_mode = "auto"
