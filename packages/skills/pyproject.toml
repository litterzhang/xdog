[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog-skills"
version = "2.4.9"
description = "Common medium-level agent skills with isolated support and extension code"
requires-python = ">=3.12"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
authors = [{ name = "HugeMan" }]
classifiers = ["Operating System :: POSIX :: Linux", "Typing :: Typed", "Programming Language :: Python :: 3"]
dependencies = ["xdog-agent>=2.4.9"]

[project.entry-points."xdog.capabilities"]
goal = "xdog.skills.goal.runtime:provider"

[tool.hatch.build]
exclude = ["**/.xdog", "**/.xdog/**", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/xdog"]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
asyncio_mode = "auto"
