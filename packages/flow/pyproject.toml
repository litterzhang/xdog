[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog-flow"
version = "2.3.0"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [{ name = "HugeMan" }]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
dependencies = [
    "xdog-ai>=2.3.0",
    "xdog-agent>=2.3.0",
    "xdog-tui>=2.3.0",
    "pydot",
    "jsonpath-ng",
    "fastjsonschema",
]

[project.urls]
Homepage = "https://xdog.942295.xyz"
Repository = "https://github.com/litterzhang/xdog"
Documentation = "https://xdog.942295.xyz"
Issues = "https://github.com/litterzhang/xdog/issues"

[project.scripts]
xdog-flow = "xdog.flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xdog"]

# The examples are executable artifacts, useless to anyone who installed from
# PyPI if they only exist in the repository, so they land inside the package.
#
# The skill is NOT force-included: it lives in the package source directly. It
# was force-included, which meant it existed in the wheel and not when running
# from a checkout — so `packaged_skills()` found nothing in development and
# everything in production, and the one environment nobody tests is the one
# where a missing skill silently teaches an agent a format it was never shown.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "xdog/flow/examples"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Untyped third-party imports. Keep this list to modules flow actually imports —
# warn_unused_configs reports dead entries, and a stale one hides a real gap.
# (fastjsonschema is agent's runtime dep, not flow's; flow never imports it.)
module = ["agent.*", "ai.*", "ai", "pydot", "jsonpath_ng"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
