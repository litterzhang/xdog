name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret is just as exposed in a commit from a year
          # ago as in the tip, and this repository is public.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Authenticate the owner lookup too: shared runner IPs hit the public
          # API limit and otherwise trigger a spurious license failure.
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync

      # The cheapest possible check, and the one that was missing: every
      # distribution we upload must at least import. `ruff` cannot catch a
      # module path that does not resolve, and nothing else in CI touched
      # claw or coding — so `xdog-claw` shipped to PyPI for several releases
      # with `import claw.core.memory` left over from the namespace move,
      # raising ModuleNotFoundError on the very first import.
      - name: Every published package imports
        run: |
          uv run python - <<'PY'
          import importlib, sys
          mods = ["xdog.ai", "xdog.agent", "xdog.agent.skills", "xdog.tui",
                  "xdog.flow", "xdog.flow.cli", "xdog.claw.core",
                  "xdog.coding.core.slash_commands", "xdog.eyes", "xdog.eyes.cli", "xdog.goal"]
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
                  print(f"ok   {m}")
              except Exception as exc:
                  bad.append(f"{m}: {type(exc).__name__}: {exc}")
                  print(f"FAIL {m}: {exc}")
          if bad:
              sys.exit("unimportable module(s): " + "; ".join(bad))
          PY

      - name: Tests
        run: uv run python scripts/test.py

      - name: Lint
        run: uv run ruff check packages

      # Every package, strictly. Getting here meant deleting a dead tool layer
      # and fixing a dozen real defects; keeping it means a new one cannot land
      # without either a type or an explicit, narrow ignore.
      - name: Types
        run: >
          uv run mypy --strict
          -p xdog.ai -p xdog.agent -p xdog.tui -p xdog.flow
          -p xdog.site -p xdog.claw -p xdog.coding -p xdog.eyes -p xdog.goal

      # The examples are executable artifacts, not decoration: this catches a
      # workflow whose companion suite stopped passing after a kernel change.
      - name: Example suites
        run: uv run xdog-flow test packages/flow/examples/ --allow-script-stub

      # The examples and the authoring skill are force-included into the wheel.
      # Nothing in the unit tests can see that — an editable install has them at
      # their source paths — so check the artifact CI actually produces.
      - name: Wheel ships the examples and the skill
        run: |
          uv build --package xdog-flow --out-dir /tmp/wheelcheck
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("/tmp/wheelcheck/*.whl")[0]).namelist()
          need = [
              "xdog/flow/examples/agent_calculator.json",
              "xdog/flow/examples/depins_enrich/cycle.py",
              "xdog/flow/skills/flow-workflows/SKILL.md",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"wheel is missing packaged data: {missing}")
          print(f"wheel carries {len([n for n in names if '/examples/' in n])} example files")
          PY

      - name: Eyes example and independently packaged skill
        run: |
          uv run xdog-eyes validate packages/eyes/src/xdog/eyes/examples/source-test-review.json
          uv run xdog-eyes validate packages/eyes/src/xdog/eyes/examples/scheduled-review.json
          uv build --package xdog-eyes --out-dir /tmp/eyes-wheelcheck
          python - <<'PY'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("/tmp/eyes-wheelcheck/xdog_eyes-*.whl")[0])
          need = {"xdog/eyes/skills/eyes-observers/SKILL.md",
                  "xdog/eyes/examples/source-test-review.json", "xdog/eyes/py.typed",
                  "xdog/eyes/examples/scheduled-review.json", "xdog/eyes/sources/scheduler.py",
                  "xdog/eyes/detectors/scheduler_due.py"}
          assert need <= set(wheel.namelist()), need - set(wheel.namelist())
          from email.parser import Parser
          metadata = Parser().parsestr(wheel.read(
              next(n for n in wheel.namelist() if n.endswith("METADATA"))).decode())
          # Eyes is independent of every XDOG harness. Only its ACP SDK and
          # bounded cron calendar dependency are approved; reject any extras.
          expected = ["agent-client-protocol<0.13,>=0.12.1; python_version < '3.15'", "croniter<7,>=2.0"]
          assert sorted(metadata.get_all("Requires-Dist", [])) == sorted(expected), metadata.get_all("Requires-Dist")
          PY

      # A dependency named `ai` or `flow` on PyPI is somebody else's package.
      # Publishing metadata that points at one is a supply-chain bug, so fail
      # the build rather than discover it after upload.
      - name: No bare inter-package requirements
        run: |
          uv build --package xdog-flow --out-dir /tmp/metacheck
          python - <<'PY'
          import glob, re, sys, zipfile
          wheel = glob.glob("/tmp/metacheck/*.whl")[0]
          meta = zipfile.ZipFile(wheel).read(
              next(n for n in zipfile.ZipFile(wheel).namelist() if n.endswith("METADATA"))
          ).decode()
          reqs = re.findall(r"^Requires-Dist: (\S+)", meta, re.M)
          bad = [r for r in reqs if r in {"ai", "agent", "tui", "flow", "claw", "coding", "site"}]
          print("Requires-Dist:", reqs)
          if bad:
              sys.exit(f"bare inter-package requirement(s) would resolve to unrelated PyPI projects: {bad}")
          PY
