name: publish

# Publishes the eight distributions to PyPI via Trusted Publishing (OIDC) — no API
# token is stored anywhere. PyPI verifies the request came from this repository,
# this workflow file, and the named environment.
#
# Two ways in:
#   * push a tag `vX.Y.Z`  → builds and publishes every package
#   * Run workflow…         → publish a subset, for a staged first release
#
# Publish order does not matter: PyPI does not resolve Requires-Dist at upload
# time, only at install time, and all eight land in the same run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          JSON array of packages to publish, e.g. ["xdog-skills"].
          Use a subset for a new package after configuring its PyPI pending
          trusted publisher and matching per-package GitHub environment.
        default: '["xdog-ai","xdog-tui","xdog-agent","xdog-flow","xdog-claw","xdog-coding","xdog-eyes","xdog-skills"]'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Publish the eight library/client distributions, excluding the website
        # (`xdog-site`) and the workspace umbrella (`xdog`).
        package: ${{ fromJSON(inputs.packages || '["xdog-ai","xdog-tui","xdog-agent","xdog-flow","xdog-claw","xdog-coding","xdog-eyes","xdog-skills"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build --package ${{ matrix.package }} --out-dir dist
      - name: Verify Eyes release artifact
        if: matrix.package == 'xdog-eyes'
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import os, tomllib, zipfile
          from email.parser import Parser
          from pathlib import Path

          project = tomllib.loads(Path("packages/eyes/pyproject.toml").read_text())["project"]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              need = {"xdog/eyes/skills/eyes/SKILL.md", "xdog/eyes/py.typed",
                      "xdog/eyes/examples/source-test-review.json",
                      "xdog/eyes/examples/scheduled-review.json",
                      "xdog/eyes/sources/scheduler.py", "xdog/eyes/detectors/scheduler_due.py"}
              assert need <= names, need - names
              metadata = Parser().parsestr(wheel.read(
                  next(name for name in names if name.endswith(".dist-info/METADATA"))).decode())
          assert metadata["Name"] == project["name"] == "xdog-eyes"
          assert metadata["Version"] == project["version"]
          tag = os.environ.get("RELEASE_TAG", "")
          assert not tag or tag == "v" + project["version"], (tag, project["version"])
          expected = ["agent-client-protocol<0.13,>=0.12.1; python_version < '3.15'", "croniter<7,>=2.0"]
          assert sorted(metadata.get_all("Requires-Dist", [])) == sorted(expected)
          print("Verified Eyes version, tag, standalone dependencies, skill and scheduler resources")
          PY
      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python scripts/test.py
      - run: uv run ruff check packages
      - run: uv run mypy --strict -p xdog.flow -p xdog.skills -p xdog.eyes

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    strategy:
      # One environment per package: PyPI keys a *pending* publisher on
      # (owner, repository, workflow, environment), so packages sharing one
      # environment name is ambiguous — it cannot tell which project an upload
      # should create — and registering the second one is rejected outright.
      # Per-package environments also mean one package failing does not block
      # the rest, and each can carry its own approval gate.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages || '["xdog-ai","xdog-tui","xdog-agent","xdog-flow","xdog-claw","xdog-coding","xdog-eyes","xdog-skills"]') }}
    environment: pypi-${{ matrix.package }}
    permissions:
      # Mints the short-lived OIDC token PyPI trades for an upload token.
      # Without this the action silently falls back to looking for a password.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # Only for tag pushes, and only once PyPI accepted the upload — a Release
    # that points at versions nobody can install is worse than no Release.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
