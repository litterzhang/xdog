[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdog"
version = "2.3.0"
description = "Tools for building AI agents and managing LLM deployments"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
authors = [
    { name = "HugeMan" },
]

dependencies = [
    "xdog-ai>=2.3.0",
    "xdog-agent>=2.3.0",
    "xdog-flow>=2.3.0",
    "xdog-site>=2.3.0",
    # Not runtime dependencies of anything above — listed so `uv sync` installs
    # them into the dev venv. Without this CI never imports them, and a broken
    # import ships to PyPI unnoticed (it did: xdog-claw 0.57.x).
    "xdog-claw>=2.3.0",
    "xdog-coding>=2.3.0",
]

[project.urls]
Homepage = "https://xdog.942295.xyz"
Repository = "https://github.com/litterzhang/xdog"
Documentation = "https://xdog.942295.xyz"
Issues = "https://github.com/litterzhang/xdog/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
xdog-ai = "xdog.ai.cli:main"
xdog-agent = "xdog.agent.cli:main"
xdog-flow = "xdog.flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/ai/src/xdog",
    "packages/agent/src/xdog",
    "packages/flow/src/xdog",
]

[tool.uv.workspace]
members = [
    "packages/ai",
    "packages/agent",
    "packages/flow",
    "packages/tui",
    "packages/site",
    "packages/claw",
    "packages/coding",
]

[tool.uv.sources]
xdog-ai = { workspace = true }
xdog-agent = { workspace = true }
xdog-flow = { workspace = true }
xdog-tui = { workspace = true }
xdog-site = { workspace = true }
xdog-claw = { workspace = true }
xdog-coding = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/ai/tests",
    "packages/agent/tests",
    "packages/flow/tests",
    "packages/site/tests",
    "packages/claw/tests",
    "packages/coding/tests",
    "packages/tui/tests",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Authored content tables: one-line card descriptions read better un-wrapped than
# split to satisfy the 120-col limit.
"packages/site/src/xdog/site/content/flow_docs.py" = ["E501"]
# Package __init__.py files re-export their public API; imports there are
# intentional even when the module itself doesn't reference them.
"**/__init__.py" = ["F401"]
# Pre-existing E501 debt in packages outside flow/site. Ignored per-file so the
# strict 120-col limit still applies to new code and to flow/site.
"packages/agent/src/xdog/agent/tools/tool_filesystem.py" = ["E501"]
"packages/agent/tests/test_agent_loop.py" = ["E501"]
"packages/agent/tests/test_before_after_hooks.py" = ["E501"]
"packages/agent/tests/test_parallel_tool_execution.py" = ["E501"]
"packages/ai/src/xdog/ai/core.py" = ["E501"]
"packages/ai/src/xdog/ai/protocols/openai_responses.py" = ["E501"]
"packages/ai/src/xdog/ai/providers/copilot.py" = ["E501"]
"packages/ai/src/xdog/ai/vendors/copilot/_model_sync.py" = ["E501"]
"packages/claw/src/xdog/claw/cli/cli.py" = ["E501"]
"packages/claw/tests/test_agent_session.py" = ["E501"]
"packages/claw/tests/test_gateway.py" = ["E501"]
"packages/claw/tests/test_scheduler.py" = ["E501"]
"packages/claw/tests/test_tools_memory.py" = ["E501"]
"packages/tui/src/xdog/tui/components/markdown.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["openai", "sentence_transformers", "sqlite_vec", "rank_bm25", "qrcode", "croniter", "xdog.agent", "xdog.agent.*", "xdog.ai", "xdog.ai.*", "xdog.flow", "xdog.flow.*", "flask", "flask.*", "markupsafe", "markupsafe.*", "markdown", "markdown.*", "frontmatter", "frontmatter.*", "fastjsonschema", "jsonpath_ng", "jsonpath_ng.*"]
ignore_missing_imports = true
